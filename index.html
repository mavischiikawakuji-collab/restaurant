/* Global box-sizing and anti overflow */

*, *::before, *::after {
  box-sizing: border-box;
  font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
}

.serif {
  font-family: "Noto Serif TC", "Noto Sans TC", serif;
}

html {
  touch-action:auto;
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
  max-width: 100vw;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  background: var(--bg);
  color: var(--ink);
}

body {
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
  max-width: 100vw;
  width: 100%;
  margin: 0;
  overscroll-behavior-y: none;
}

/* iOS zoom lock: all inputs >=16px */

input, textarea, select {
  font-size: 16px !important;
}

/* but we keep visual size controlled via Tailwind classes that use same px, but min 16px prevents zoom */

::-webkit-scrollbar{
  width:6px;
  height:6px
}

::-webkit-scrollbar-thumb{
  background: var(--line-strong);
  border-radius: 999px
}

@keyframes floatIn {
  from {
    opacity:0;
    transform: translateY(16px)
  }

  to {
    opacity:1;
    transform: translateY(0)
  }
}

@keyframes pop {
  0% {
    opacity:0;
    transform: translate(-50%,-48%) scale(0.96)
  }

  100% {
    opacity:1;
    transform: translate(-50%,-50%) scale(1)
  }
}

@keyframes toastIn {
  from {
    opacity:0;
    transform: translateY(12px)
  }

  to {
    opacity:1;
    transform: translateY(0)
  }
}

@keyframes shimmer {
  0%{
    background-position:-200% 0
  }

  100%{
    background-position:200% 0
  }
}

/* Mobile fixes */

@media (max-width: 480px) {
  .mobile-px {
    padding-left: 16px !important;
    padding-right: 16px !important;
  }

  .mobile-py {
    padding-top: 16px !important;
    padding-bottom: 16px !important;
  }
}

/* Tabs horizontal scroll hidden scrollbar */

.tabs-scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.tabs-scroll::-webkit-scrollbar {
  display: none;
}

/* Ensure Radix dialog content never exceeds viewport on mobile */

@media (max-width: 640px) {
  [data-radix-dialog-content] {
    width: 92vw !important;
    max-width: 92vw !important;
    left: 4vw !important;
    right: 4vw !important;
    transform: translate(0, -50%) !important;
    max-height: 85vh !important;
  }
}

<script>
(function(){
  function setupFiltering(){
    const districtInput = document.querySelector('input[list="district-datalist"]');
    const typeInput = document.querySelector('input[list="type-datalist"]');
    const districtList = document.getElementById('district-datalist');
    const typeList = document.getElementById('type-datalist');
    if(!districtInput || !typeInput || !districtList || !typeList) { setTimeout(setupFiltering, 500); return; }

    // Store original options
    const districtOptions = Array.from(districtList.options).map(o=>o.value);
    const typeOptions = Array.from(typeList.options).map(o=>o.value);

    function filterList(input, list, allOptions){
      const val = input.value.trim().toLowerCase();
      list.innerHTML = '';
      if(val.length === 0) return; // empty => show nothing, only show when typed
      const filtered = allOptions.filter(opt => opt.toLowerCase().includes(val));
      filtered.forEach(optVal => {
        const opt = document.createElement('option');
        opt.value = optVal;
        list.appendChild(opt);
      });
    }

    // Initially clear lists so nothing pops on focus
    districtList.innerHTML = '';
    typeList.innerHTML = '';

    districtInput.addEventListener('input', ()=>filterList(districtInput, districtList, districtOptions));
    districtInput.addEventListener('focus', ()=>filterList(districtInput, districtList, districtOptions));
    typeInput.addEventListener('input', ()=>filterList(typeInput, typeList, typeOptions));
    typeInput.addEventListener('focus', ()=>filterList(typeInput, typeList, typeOptions));
    
    // Also re-capture when React updates options (when new restaurant added)
    const observer = new MutationObserver(()=>{
      const newD = Array.from(document.getElementById('district-datalist')?.options || []).map(o=>o.value);
      const newT = Array.from(document.getElementById('type-datalist')?.options || []).map(o=>o.value);
      // if lists were cleared, restore from stored + new
      // We'll update stored options from localStorage data
      try{
        const data = JSON.parse(localStorage.getItem('restaurant-blackwhite-v2')||'[]');
        const ds = [...new Set(data.map(d=>d.district).filter(Boolean))];
        const ts = [...new Set(data.map(d=>d.type).filter(Boolean))];
        // Merge
        ds.forEach(v=>{ if(!districtOptions.includes(v)) districtOptions.push(v); });
        ts.forEach(v=>{ if(!typeOptions.includes(v)) typeOptions.push(v); });
      }catch(e){}
    });
    observer.observe(document.body, {childList:true, subtree:true});
  }
  setTimeout(setupFiltering, 1000);
})();
</script>

(function(){
  let pendingDeleteId = null;
  const bg = document.getElementById('customConfirmBg');
  const clearBg = document.getElementById('customClearBg');
  window.customConfirmDelete = function(id){
    pendingDeleteId = id;
    bg.style.display = 'flex';
  };
  window.customConfirmClearAll = function(){
    clearBg.style.display = 'flex';
  };
  function closeAll(){
    bg.style.display = 'none';
    clearBg.style.display = 'none';
    pendingDeleteId = null;
  }
  document.getElementById('customConfirmCancel').onclick = closeAll;
  document.getElementById('customClearCancel').onclick = closeAll;
  bg.onclick = (e)=>{ if(e.target===bg) closeAll(); };
  clearBg.onclick = (e)=>{ if(e.target===clearBg) closeAll(); };
  document.getElementById('customConfirmOk').onclick = function(){
    if(pendingDeleteId){
      try{
        // Try both possible keys
        ['shikiji-blackwhite-v2','restaurant-blackwhite-v2'].forEach(key=>{
          const raw = localStorage.getItem(key);
          if(raw){
            let data = JSON.parse(raw);
            const filtered = data.filter(d=>d.id!==pendingDeleteId);
            if(filtered.length !== data.length){
              localStorage.setItem(key, JSON.stringify(filtered));
            }
          }
        });
      }catch(e){ console.error(e); }
      closeAll();
      setTimeout(()=>location.reload(), 100);
    }
  };
  document.getElementById('customClearOk').onclick = function(){
    try{
      ['shikiji-blackwhite-v2','restaurant-blackwhite-v2'].forEach(key=>{
        localStorage.setItem(key, JSON.stringify([]));
      });
    }catch(e){}
    closeAll();
    setTimeout(()=>location.reload(), 100);
  };
  function setupFiltering(){
    const dInput = document.querySelector('input[list="district-datalist"]');
    const tInput = document.querySelector('input[list="type-datalist"]');
    const dList = document.getElementById('district-datalist');
    const tList = document.getElementById('type-datalist');
    if(!dInput || !dList){ setTimeout(setupFiltering, 500); return; }
    let dOptions = Array.from(dList.options).map(o=>o.value);
    let tOptions = tList ? Array.from(tList.options).map(o=>o.value) : [];
    function filter(input, list, all){
      const v = input.value.trim().toLowerCase();
      list.innerHTML = '';
      if(v.length===0) return;
      all.filter(opt=>opt.toLowerCase().includes(v)).forEach(val=>{
        const o=document.createElement('option'); o.value=val; list.appendChild(o);
      });
    }
    if(dList) dList.innerHTML=''; if(tList) tList.innerHTML='';
    if(dInput) dInput.addEventListener('input', ()=>filter(dInput, dList, dOptions));
    if(tInput) tInput.addEventListener('input', ()=>filter(tInput, tList, tOptions));
  }
  setTimeout(setupFiltering, 800);
})();
</script>

</body>
</html>
